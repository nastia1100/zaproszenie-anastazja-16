<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zaproszenie</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================
           TŁO
        ===================================== */

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    ellipse at center,
                    #1b3155 0%,
                    #0c1b32 48%,
                    #050c18 100%
                );

            color: white;
        }


        /* delikatna faktura */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.15;

            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 4px,
                    rgba(255,255,255,0.015) 5px
                );
        }


        /* =====================================
           NAGŁÓWEK
        ===================================== */

        .heading {
            position: fixed;

            top: 9%;
            left: 50%;

            transform: translateX(-50%);

            text-align: center;

            transition:
                opacity 0.5s ease,
                transform 0.7s ease;
        }

        .heading h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-weight: normal;

            font-size: 45px;

            letter-spacing: 3px;

            color: #f5f3ed;
        }

        .heading p {
            margin-top: 12px;

            color: #9daec6;

            font-size: 13px;

            letter-spacing: 1px;
        }


        /* =====================================
           SCENA
        ===================================== */

        .scene {
            position: relative;

            width: 500px;
            height: 330px;
        }


        /* =====================================
           KOPERTA
        ===================================== */

        .envelope {
            position: absolute;

            width: 480px;
            height: 300px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            cursor: pointer;

            filter:
                drop-shadow(
                    0 30px 40px rgba(0,0,0,0.55)
                );

            transition:
                transform 0.4s ease;
        }


        /* główny materiał koperty */

        .envelope-back {
            position: absolute;

            inset: 0;

            border-radius: 5px;

            background:
                linear-gradient(
                    120deg,
                    #102b52 0%,
                    #0a2347 35%,
                    #071b39 70%,
                    #05152e 100%
                );

            border:
                1px solid rgba(255,255,255,0.08);

            box-shadow:
                inset 0 2px 3px rgba(255,255,255,0.08),
                inset 0 -15px 25px rgba(0,0,0,0.2);
        }


        /* delikatne złote obramowanie */

        .gold-border {
            position: absolute;

            inset: 9px;

            border:
                1px solid rgba(207,174,91,0.45);

            border-radius: 3px;

            pointer-events: none;

            z-index: 2;
        }


        /* =====================================
           KARTKA W KOPERCIE
        ===================================== */

        .letter {
            position: absolute;

            width: 400px;
            height: 275px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background:
                linear-gradient(
                    135deg,
                    #fffefa,
                    #f1eee5
                );

            color: #18263d;

            border-radius: 3px;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.35);

            z-index: 3;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.4s ease;
        }


        /* =====================================
           BOCZNE ZAGIĘCIA KOPERTY
        ===================================== */

        .left-fold {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-left:
                240px solid #0b2448;

            border-top:
                150px solid transparent;

            z-index: 5;
        }


        .right-fold {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-right:
                240px solid #091f40;

            border-top:
                150px solid transparent;

            z-index: 5;
        }


        /* =====================================
           PRZÓD KOPERTY
        ===================================== */

        .envelope-front {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    145deg,
                    #12315b,
                    #092047
                );

            clip-path:
                polygon(
                    0 0,
                    50% 58%,
                    100% 0,
                    100% 100%,
                    0 100%
                );

            border-radius: 5px;

            z-index: 6;

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.08);
        }


        /* =====================================
           ZŁOTE LINIE NA KOPERCIE
        ===================================== */

        .gold-line-left {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 235px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #c9a957
                );

            transform:
                rotate(31deg);

            transform-origin: left;

            z-index: 7;

            opacity: 0.65;
        }


        .gold-line-right {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 235px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    #c9a957,
                    transparent
                );

            transform:
                rotate(-31deg);

            transform-origin: right;

            z-index: 7;

            opacity: 0.65;
        }


        /* =====================================
           KLAPA
        ===================================== */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 180px;

            background:
                linear-gradient(
                    145deg,
                    #16375f,
                    #0c274e 50%,
                    #071d3c
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 100%
                );

            transform-origin: top center;

            transition:
                transform 0.9s
                cubic-bezier(.2,.8,.2,1);

            z-index: 9;

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.08);
        }


        /* złota linia na klapie */

        .flap::after {
            content: "";

            position: absolute;

            left: 50%;
            top: 5px;

            width: 1px;
            height: 165px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(210,178,91,0.0),
                    rgba(210,178,91,0.35)
                );

            transform:
                rotate(0deg)
                translateX(-50%);
        }


        /* =====================================
           PIECZĘĆ
        ===================================== */

        .seal {
            position: absolute;

            left: 50%;
            top: 140px;

            width: 60px;
            height: 60px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f7dda0,
                    #d4ad58 45%,
                    #98702c 80%,
                    #70501e 100%
                );

            border:
                3px solid #e1c678;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.45),
                inset 2px 2px 4px
                rgba(255,255,255,0.45),
                inset -3px -3px 5px
                rgba(70,40,0,0.3);

            z-index: 12;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                opacity 0.4s ease,
                transform 0.5s ease;
        }


        .seal::before {
            content: "A";

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 31px;

            font-style: italic;

            color: #503814;
        }


        /* =====================================
           ETAP 1 — OTWARCIE KOPERTY
        ===================================== */

        .envelope.open .flap {
            transform:
                rotateX(180deg);

            z-index: 2;
        }


        .envelope.open .seal {
            opacity: 0;

            transform:
                translateX(-50%)
                scale(0.3);
        }


        /*
        Kartka po otwarciu koperty
        nadal pozostaje w środku.
        */

        .envelope.open .letter {
            opacity: 1;
        }


        /* =====================================
           PRZYCISK
        ===================================== */

        .action {
            position: fixed;

            left: 50%;
            bottom: 9%;

            transform:
                translateX(-50%);

            padding: 15px 30px;

            border-radius: 30px;

            border:
                1px solid rgba(207,174,91,0.55);

            background:
                rgba(12,28,53,0.8);

            color: #e8d092;

            font-size: 14px;

            letter-spacing: 0.8px;

            cursor: pointer;

            transition:
                opacity 0.4s ease,
                transform 0.3s ease,
                background 0.3s ease;

            z-index: 50;
        }


        .action:hover {
            background:
                rgba(30,53,87,0.9);

            transform:
                translateX(-50%)
                translateY(-3px);
        }


        /* =====================================
           TEKST NA PRZYCISKU
        ===================================== */

        .action.pull {
            display: none;
        }


        /* =====================================
           ETAP 2
           
           WYCIĄGANIE KARTKI
        ===================================== */

        .scene.pulling .letter {

            position: fixed;

            left: 50%;
            top: 50%;

            width: min(620px, 88vw);
            height: min(700px, 80vh);

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;

            z-index: 100;

            pointer-events: auto;

            animation:
                pullLetter 1.2s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        @keyframes pullLetter {

            0% {

                opacity: 1;

                transform:
                    translate(-50%, 25%)
                    scale(0.72);
            }

            35% {

                transform:
                    translate(-50%, -60%)
                    scale(0.85);
            }

            70% {

                transform:
                    translate(-50%, -50%)
                    scale(1.04);
            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }


        /* =====================================
           ZAWARTOŚĆ ZAPROSZENIA
        ===================================== */

        .letter-inner {
            width: calc(100% - 40px);
            height: calc(100% - 40px);

            margin: 20px;

            border:
                1px solid #cfc8b8;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 35px;
        }


        .letter-small {
            font-size: 10px;

            letter-spacing: 5px;

            color: #8b7953;

            margin-bottom: 22px;
        }


        .letter h2 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 38px;

            line-height: 1.25;

            font-weight: normal;

            color: #142a4b;

            margin-bottom: 20px;
        }


        .letter-text {
            max-width: 440px;

            font-size: 15px;

            line-height: 1.7;

            color: #596575;
        }


        .details {
            margin-top: 25px;

            padding: 17px 30px;

            border-top:
                1px solid #cfc8b8;

            border-bottom:
                1px solid #cfc8b8;

            font-size: 13px;

            line-height: 2;

            color: #293d5a;

            letter-spacing: 0.5px;
        }


        .ending {
            margin-top: 22px;

            font-family:
                Georgia,
                serif;

            font-size: 16px;

            color: #394b64;
        }


        /* =====================================
           PO WYCIĄGNIĘCIU
        ===================================== */

        .scene.pulled .envelope {
            opacity: 0.75;

            transform:
                translate(-50%, -50%)
                scale(0.82);
        }


        .scene.pulled .letter {
            opacity: 1;
        }


        .scene.pulled ~ .heading {
            opacity: 0;
        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 600px) {

            .heading {
                top: 8%;
            }

            .heading h1 {
                font-size: 32px;
            }

            .heading p {
                font-size: 11px;
            }

            .scene {
                width: 350px;
                height: 220px;
            }

            .envelope {
                width: 340px;
                height: 215px;
            }

            .left-fold {
                border-left-width: 170px;
                border-top-width: 110px;
            }

            .right-fold {
                border-right-width: 170px;
                border-top-width: 110px;
            }

            .flap {
                height: 130px;
            }

            .seal {
                width: 45px;
                height: 45px;

                top: 100px;
            }

            .seal::before {
                font-size: 23px;
            }

            .scene.pulling .letter {

                width: 88vw;

                height: 76vh;

                padding: 0;
            }

            .letter-inner {
                width: calc(100% - 25px);
                height: calc(100% - 25px);

                margin: 12px;

                padding: 18px;
            }

            .letter-small {
                font-size: 8px;

                letter-spacing: 3px;
            }

            .letter h2 {
                font-size: 27px;
            }

            .letter-text {
                font-size: 12px;
            }

            .details {
                font-size: 10px;

                padding: 10px 15px;
            }

            .ending {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         TYTUŁ
    ===================================== -->

    <div class="heading">

        <h1>
            Zaproszenie
        </h1>

        <p>
            Otwórz kopertę
        </p>

    </div>


    <!-- =====================================
         SCENA
    ===================================== -->

    <div
        class="scene"
        id="scene"
    >


        <!-- KOPERTA -->

        <div
            class="envelope"
            id="envelope"
        >


            <!-- TYŁ -->

            <div class="envelope-back"></div>


            <!-- ZŁOTE OBRAMOWANIE -->

            <div class="gold-border"></div>


            <!-- KARTKA -->

            <div class="letter">

                <div class="letter-inner">

                    <div class="letter-small">
                        SERDECZNIE ZAPRASZAM
                    </div>

                    <h2>
                        Na moje<br>
                        16. urodziny
                    </h2>

                    <p class="letter-text">
                        Będzie mi bardzo miło,
                        jeśli będziesz razem ze mną
                        świętować ten wyjątkowy dzień.
                    </p>

                    <div class="details">

                        <div>
                            <strong>
                                20 WRZEŚNIA 2026
                            </strong>
                        </div>

                        <div>
                            GODZINA 17:00
                        </div>

                        <div>
                            MÓJ DOM
                        </div>

                    </div>

                    <p class="ending">
                        Do zobaczenia!
                    </p>

                </div>

            </div>


            <!-- BOCZNE ELEMENTY -->

            <div class="left-fold"></div>

            <div class="right-fold"></div>


            <!-- PRZÓD -->

            <div class="envelope-front"></div>


            <!-- ZŁOTE LINIE -->

            <div class="gold-line-left"></div>

            <div class="gold-line-right"></div>


            <!-- KLAPA -->

            <div class="flap"></div>


            <!-- PIECZĘĆ -->

            <div class="seal"></div>


        </div>

    </div>


    <!-- =====================================
         PRZYCISK
    ===================================== -->

    <button
        class="action"
        id="action"
    >
        Otwórz kopertę
    </button>


    <script>

        const envelope =
            document.getElementById("envelope");

        const scene =
            document.getElementById("scene");

        const action =
            document.getElementById("action");


        let state = "closed";


        action.addEventListener("click", function () {


            /* =========================
               ETAP 1
            ========================= */

            if (state === "closed") {

                envelope.classList.add("open");

                state = "opened";

                action.textContent =
                    "Wyciągnij zaproszenie";


                document
                    .querySelector(".heading p")
                    .textContent =
                    "Teraz wyciągnij kartkę";


                return;
            }


            /* =========================
               ETAP 2
            ========================= */

            if (state === "opened") {

                scene.classList.add("pulling");

                state = "pulled";

                action.textContent =
                    "Zaproszenie";

                setTimeout(function () {

                    scene.classList.add("pulled");

                }, 1200);

            }

        });


        /* Kliknięcie samej koperty */

        envelope.addEventListener(
            "click",
            function () {

                if (state === "closed") {

                    envelope.classList.add("open");

                    state = "opened";

                    action.textContent =
                        "Wyciągnij zaproszenie";

                    document
                        .querySelector(".heading p")
                        .textContent =
                        "Teraz wyciągnij kartkę";
                }

            }
        );

    </script>

</body>
</html>
