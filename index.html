<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zaproszenie na 16. urodziny</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #263b68 0%,
                    #111d38 45%,
                    #080f20 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* DELIKATNE ŚWIATŁA W TLE */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            background: rgba(120, 160, 220, 0.08);

            border-radius: 50%;

            filter: blur(80px);

            top: -200px;
            left: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 450px;
            height: 450px;

            background: rgba(90, 120, 190, 0.08);

            border-radius: 50%;

            filter: blur(80px);

            bottom: -200px;
            right: -150px;

            pointer-events: none;
        }

        /* GŁÓWNY KONTENER */

        .wrapper {
            width: 100%;
            text-align: center;
            padding: 30px;
        }

        .title {
            font-size: 46px;
            font-weight: normal;

            letter-spacing: 2px;

            margin-bottom: 10px;

            color: #f5f7fb;
        }

        .subtitle {
            color: #aebbd4;

            font-size: 16px;

            letter-spacing: 1px;

            margin-bottom: 55px;
        }

        /* KOPERTA */

        .envelope {
            position: relative;

            width: 430px;
            height: 280px;

            margin: 0 auto;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 25px 35px rgba(0,0,0,0.45)
                );

            transition: transform 0.4s ease;
        }

        .envelope:not(.open) {
            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* TYŁ KOPERTY */

        .envelope-back {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    145deg,
                    #1c3768,
                    #10244b
                );

            border-radius: 8px;

            z-index: 1;
        }

        /* KARTKA */

        .letter {
            position: absolute;

            width: 370px;
            min-height: 250px;

            left: 30px;
            bottom: 15px;

            padding: 32px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #eef2f8
                );

            color: #16243d;

            border-radius: 6px;

            z-index: 2;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);

            transition:
                bottom 1s cubic-bezier(.2,.8,.2,1),
                transform 1s cubic-bezier(.2,.8,.2,1);

            text-align: center;
        }

        .letter-top {
            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 4px;

            color: #60779f;

            margin-bottom: 15px;
        }

        .letter h2 {
            font-size: 30px;

            line-height: 1.25;

            font-weight: normal;

            color: #13284d;

            margin-bottom: 15px;
        }

        .letter-description {
            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.6;

            color: #56657c;
        }

        .details {
            margin-top: 20px;

            padding: 14px;

            border-top: 1px solid #ccd5e3;
            border-bottom: 1px solid #ccd5e3;

            font-family: Arial, sans-serif;

            font-size: 13px;

            color: #263b5c;

            line-height: 1.8;
        }

        .ending {
            margin-top: 18px;

            font-family: Georgia, serif;

            font-size: 15px;

            color: #263b5c;
        }

        /* PRZÓD KOPERTY */

        .envelope-front {
            position: absolute;

            inset: 0;

            z-index: 4;

            background:
                linear-gradient(
                    145deg,
                    #1e3b70,
                    #10264f
                );

            clip-path:
                polygon(
                    0 0,
                    50% 55%,
                    100% 0,
                    100% 100%,
                    0 100%
                );

            border-radius: 8px;
        }

        /* KLAPA */

        .flap {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 160px;

            background:
                linear-gradient(
                    145deg,
                    #294a83,
                    #173360
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 100%
                );

            transform-origin: top center;

            transition:
                transform 0.9s cubic-bezier(.2,.8,.2,1);

            z-index: 5;
        }

        /* MAŁA ETYKIETA NA KOPERCIE */

        .seal {
            position: absolute;

            left: 50%;
            top: 128px;

            transform: translateX(-50%);

            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: #d8b56d;

            color: #172b50;

            z-index: 6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 1px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.2);

            transition:
                opacity 0.4s ease,
                transform 0.5s ease;
        }

        /* OTWIERANIE */

        .envelope.open {
            animation: none;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);

            z-index: 1;
        }

        .envelope.open .seal {
            opacity: 0;

            transform:
                translateX(-50%)
                scale(0);
        }

        /*
        KARTKA WYSUWA SIĘ DUŻO WYŻEJ
        I POWIĘKSZA SIĘ
        */

        .envelope.open .letter {
            bottom: 170px;

            transform:
                scale(1.45);

            z-index: 10;
        }

        /* PRZYCISK */

        .open-button {
            margin-top: 55px;

            padding: 14px 30px;

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 30px;

            background:
                rgba(255,255,255,0.08);

            color: #f5f7fb;

            font-family: Arial, sans-serif;

            font-size: 14px;

            letter-spacing: 0.5px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        .open-button:hover {
            background:
                rgba(255,255,255,0.16);

            transform:
                translateY(-3px);
        }

        /* INFORMACJA POD PRZYCISKIEM */

        .hint {
            margin-top: 18px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: #7f90ad;
        }

        /* TELEFON */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            .wrapper {
                padding: 20px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 13px;

                margin-bottom: 35px;
            }

            .envelope {
                width: 330px;
                height: 215px;
            }

            .letter {
                width: 285px;

                left: 22.5px;

                min-height: 195px;

                padding: 22px;
            }

            .letter h2 {
                font-size: 22px;
            }

            .letter-description {
                font-size: 11px;
            }

            .details {
                font-size: 10px;

                margin-top: 12px;

                padding: 8px;
            }

            .ending {
                font-size: 12px;

                margin-top: 10px;
            }

            .flap {
                height: 120px;
            }

            .seal {
                top: 95px;

                width: 40px;
                height: 40px;

                font-size: 10px;
            }

            /*
            Na telefonie kartka również
            wychodzi mocno do góry
            */

            .envelope.open .letter {
                bottom: 130px;

                transform:
                    scale(1.12);
            }

            .open-button {
                margin-top: 45px;
            }
        }

    </style>
</head>

<body>

    <div class="wrapper">

        <h1 class="title">
            Zaproszenie
        </h1>

        <p class="subtitle">
            Mam przyjemność zaprosić Cię na wyjątkowy wieczór
        </p>


        <!-- KOPERTA -->

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>


            <!-- KARTKA -->

            <div class="letter">

                <div class="letter-top">
                    SERDECZNIE ZAPRASZAM
                </div>

                <h2>
                    Na moje<br>
                    16. urodziny
                </h2>

                <p class="letter-description">
                    Będzie mi bardzo miło,
                    jeśli spędzisz ze mną ten wyjątkowy dzień.
                </p>

                <div class="details">

                    <div>
                        <strong>20 WRZEŚNIA 2026</strong>
                    </div>

                    <div>
                        GODZINA 17:00
                    </div>

                    <div>
                        MÓJ DOM
                    </div>

                </div>

                <p class="ending">
                    Do zobaczenia!
                </p>

            </div>


            <!-- PRZÓD KOPERTY -->

            <div class="envelope-front"></div>


            <!-- KLAPA -->

            <div class="flap"></div>


            <!-- ZŁOTA PIECZĘĆ -->

            <div class="seal">
                16
            </div>

        </div>


        <!-- PRZYCISK -->

        <button class="open-button" id="button">
            Otwórz zaproszenie
        </button>

        <p class="hint">
            kliknij kopertę lub przycisk
        </p>

    </div>


    <script>

        const envelope =
            document.getElementById("envelope");

        const button =
            document.getElementById("button");


        function openEnvelope() {

            envelope.classList.toggle("open");


            if (envelope.classList.contains("open")) {

                button.textContent =
                    "Zamknij zaproszenie";

            } else {

                button.textContent =
                    "Otwórz zaproszenie";

            }

        }


        envelope.addEventListener(
            "click",
            openEnvelope
        );


        button.addEventListener(
            "click",
            openEnvelope
        );

    </script>

</body>
</html>
