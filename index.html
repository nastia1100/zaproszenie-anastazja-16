<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zaproszenie</title>

    <style>

        /* ================================
           PODSTAWY
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #172d50 0%,
                    #0b1a32 48%,
                    #050d1b 100%
                );

            color: white;

            overflow: hidden;
        }


        /* ================================
           DELIKATNA TEKSTURA TŁA
        ================================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.12;

            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 3px,
                    rgba(255,255,255,0.025) 4px
                );
        }


        /* ================================
           EKRAN
        ================================= */

        .screen {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            position: relative;
        }


        /* ================================
           TYTUŁ
        ================================= */

        .heading {
            position: absolute;

            top: 9%;

            text-align: center;

            transition:
                opacity 0.5s ease,
                transform 0.6s ease;
        }

        .heading h1 {
            font-family: Georgia, "Times New Roman", serif;

            font-size: 46px;

            font-weight: normal;

            letter-spacing: 2px;

            color: #f4f5f7;
        }

        .heading p {
            margin-top: 10px;

            font-size: 14px;

            letter-spacing: 1px;

            color: #91a2bd;
        }


        /* ================================
           KOPERTA
        ================================= */

        .envelope-area {
            position: relative;

            width: 480px;
            height: 310px;

            transition:
                opacity 0.7s ease,
                transform 0.8s ease;
        }


        .envelope {
            position: absolute;

            width: 100%;
            height: 100%;

            cursor: pointer;

            perspective: 1000px;

            filter:
                drop-shadow(
                    0 30px 35px rgba(0,0,0,0.5)
                );
        }


        /* ================================
           TYŁ KOPERTY
        ================================= */

        .envelope-back {
            position: absolute;

            inset: 0;

            border-radius: 5px;

            background:
                linear-gradient(
                    145deg,
                    #122d55 0%,
                    #0a2143 45%,
                    #071a36 100%
                );

            border:
                1px solid rgba(255,255,255,0.08);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -15px 25px rgba(0,0,0,0.18);

            z-index: 1;
        }


        /* ================================
           DELIKATNE ZAGIĘCIA
        ================================= */

        .left-fold {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-left: 240px solid #0d2850;
            border-top: 155px solid transparent;

            z-index: 3;
        }

        .right-fold {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-right: 240px solid #0b2348;
            border-top: 155px solid transparent;

            z-index: 3;
        }


        /* ================================
           KARTKA - CAŁKOWICIE SCHOWANA
        ================================= */

        .letter {
            position: absolute;

            width: 390px;
            height: 270px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.9);

            opacity: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    #fffefb,
                    #f4f1e9
                );

            color: #18263d;

            border-radius: 3px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            padding: 34px;

            z-index: 2;

            transition:
                opacity 0.45s ease,
                transform 0.8s cubic-bezier(.2,.8,.2,1);
        }


        /* ================================
           ZAWARTOŚĆ KARTKI
        ================================= */

        .letter-inner {
            width: 100%;
            height: 100%;

            border:
                1px solid #d8d2c5;

            padding: 25px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .letter-small {
            font-size: 10px;

            letter-spacing: 4px;

            color: #7a8493;

            margin-bottom: 15px;
        }

        .letter h2 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 31px;

            font-weight: normal;

            line-height: 1.25;

            color: #12294d;

            margin-bottom: 16px;
        }

        .letter-text {
            max-width: 290px;

            font-size: 13px;

            line-height: 1.6;

            color: #596574;
        }

        .info {
            width: 100%;

            margin-top: 17px;

            padding: 11px 5px;

            border-top: 1px solid #d4d0c7;
            border-bottom: 1px solid #d4d0c7;

            font-size: 11px;

            line-height: 1.9;

            letter-spacing: 0.5px;

            color: #263955;
        }

        .ending {
            margin-top: 13px;

            font-family: Georgia, serif;

            font-size: 14px;

            color: #394b65;
        }


        /* ================================
           PRZEDNIA CZĘŚĆ KOPERTY
        ================================= */

        .envelope-front {
            position: absolute;

            inset: 0;

            border-radius: 5px;

            background:
                linear-gradient(
                    145deg,
                    #15345f,
                    #0a2245
                );

            clip-path:
                polygon(
                    0 0,
                    50% 57%,
                    100% 0,
                    100% 100%,
                    0 100%
                );

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06);

            z-index: 4;
        }


        /* ================================
           KLAPA
        ================================= */

        .flap {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 175px;

            background:
                linear-gradient(
                    145deg,
                    #193963,
                    #0d274e
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 100%
                );

            transform-origin: top center;

            transition:
                transform 0.8s cubic-bezier(.2,.8,.2,1);

            z-index: 6;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08);
        }


        /* ================================
           ZŁOTA PIECZĘĆ
        ================================= */

        .seal {
            position: absolute;

            left: 50%;
            top: 142px;

            width: 58px;
            height: 58px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f5d995,
                    #c99d48 55%,
                    #8c6424 100%
                );

            border:
                3px solid #e2c478;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.4),
                inset 0 2px 3px rgba(255,255,255,0.45),
                inset 0 -3px 5px rgba(70,40,0,0.25);

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 8;

            transition:
                opacity 0.3s ease,
                transform 0.5s ease;
        }

        .seal::before {
            content: "A";

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 30px;

            font-style: italic;

            color: #533814;

            text-shadow:
                1px 1px 0 #f4d58a;
        }


        /* ================================
           OTWIERANIE KOPERTY
        ================================= */

        .envelope.open .flap {
            transform:
                rotateX(180deg);

            z-index: 2;
        }

        .envelope.open .seal {
            opacity: 0;

            transform:
                translateX(-50%)
                scale(0.4);
        }


        /* ================================
           KARTKA PO OTWARCIU
           
           WAŻNE:
           kartka jest ustawiana względem
           CAŁEGO ekranu, a nie góry koperty.
        ================================= */

        .envelope.open .letter {
            position: fixed;

            left: 50%;
            top: 50%;

            width: min(620px, 88vw);
            height: min(700px, 78vh);

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;

            z-index: 100;

            pointer-events: auto;

            padding: 42px;

            animation:
                letterAppear 0.8s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        @keyframes letterAppear {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.65);
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }


        /* ================================
           KIEDY OTWARTE
        ================================= */

        .screen.open .heading {
            opacity: 0;

            transform:
                translateY(-20px);
        }


        .screen.open .envelope-area {
            opacity: 1;
        }


        /* ================================
           PRZYCISK
        ================================= */

        .button {
            margin-top: 45px;

            padding: 14px 30px;

            border-radius: 30px;

            border:
                1px solid rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.07);

            color: #f4f5f7;

            font-size: 14px;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        .button:hover {
            background:
                rgba(255,255,255,0.14);

            transform:
                translateY(-3px);
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .heading {
                top: 8%;
            }

            .heading h1 {
                font-size: 32px;
            }

            .heading p {
                font-size: 12px;
            }

            .envelope-area {
                width: 340px;
                height: 220px;
            }

            .letter {
                width: 300px;
                height: 205px;

                padding: 20px;
            }

            .letter-inner {
                padding: 15px;
            }

            .letter h2 {
                font-size: 22px;
            }

            .letter-text {
                font-size: 10px;
            }

            .info {
                font-size: 9px;

                margin-top: 10px;
            }

            .ending {
                font-size: 11px;
            }

            .flap {
                height: 125px;
            }

            .seal {
                width: 45px;
                height: 45px;

                top: 100px;
            }

            .seal::before {
                font-size: 23px;
            }

            /*
              KARTKA NA ŚRODKU TELEFONU
            */

            .envelope.open .letter {
                width: 88vw;
                height: 70vh;

                padding: 18px;
            }

            .envelope.open .letter-inner {
                padding: 18px;
            }

            .envelope.open .letter h2 {
                font-size: 25px;
            }

            .envelope.open .letter-text {
                font-size: 12px;
            }

            .envelope.open .info {
                font-size: 10px;
            }

            .button {
                margin-top: 40px;
            }
        }

    </style>
</head>


<body>

    <div class="screen" id="screen">

        <!-- TYTUŁ -->

        <div class="heading">

            <h1>
                Zaproszenie
            </h1>

            <p>
                Otwórz kopertę, aby zobaczyć szczegóły
            </p>

        </div>


        <!-- KOPERTA -->

        <div class="envelope-area">

            <div
                class="envelope"
                id="envelope"
            >

                <!-- TYŁ -->

                <div class="envelope-back"></div>


                <!-- KARTKA -->

                <div class="letter">

                    <div class="letter-inner">

                        <div class="letter-small">
                            SERDECZNIE ZAPRASZAM
                        </div>

                        <h2>
                            Na moje<br>
                            16. urodziny
                        </h2>

                        <p class="letter-text">
                            Będzie mi bardzo miło,
                            jeśli będziesz razem ze mną
                            świętować ten wyjątkowy dzień.
                        </p>

                        <div class="info">

                            <div>
                                <strong>
                                    20 WRZEŚNIA 2026
                                </strong>
                            </div>

                            <div>
                                GODZINA 17:00
                            </div>

                            <div>
                                MÓJ DOM
                            </div>

                        </div>

                        <p class="ending">
                            Do zobaczenia!
                        </p>

                    </div>

                </div>


                <!-- BOCZNE ZAGIĘCIA -->

                <div class="left-fold"></div>

                <div class="right-fold"></div>


                <!-- PRZÓD -->

                <div class="envelope-front"></div>


                <!-- KLAPA -->

                <div class="flap"></div>


                <!-- PIECZĘĆ -->

                <div class="seal"></div>

            </div>

        </div>


        <!-- PRZYCISK -->

        <button
            class="button"
            id="button"
        >
            Otwórz kopertę
        </button>

    </div>


    <script>

        const envelope =
            document.getElementById("envelope");

        const button =
            document.getElementById("button");

        const screen =
            document.getElementById("screen");


        function toggleEnvelope() {

            const isOpen =
                envelope.classList.toggle("open");

            screen.classList.toggle(
                "open",
                isOpen
            );


            if (isOpen) {

                button.textContent =
                    "Zamknij zaproszenie";

            } else {

                button.textContent =
                    "Otwórz kopertę";

            }

        }


        envelope.addEventListener(
            "click",
            toggleEnvelope
        );


        button.addEventListener(
            "click",
            toggleEnvelope
        );

    </script>

</body>
</html>
