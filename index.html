```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaproszenie na 16. urodziny 💌</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💌 Zaproszenie</h1>
        <p class="instruction">Kliknij kopertę, aby ją otworzyć</p>

        <div class="envelope" id="envelope">

            <!-- KOPERTA -->
            <div class="flap"></div>
            <div class="pocket"></div>

            <!-- ZAPROSZENIE -->
            <div class="letter">
                <div class="letter-content">
                    <p class="small-title">✨ ZAPRASZAM ✨</p>

                    <h2>Na moje<br>16. urodziny! 🎂</h2>

                    <p>
                        Będzie mi bardzo miło,
                        jeśli będziesz razem ze mną
                        świętować ten wyjątkowy dzień!
                    </p>

                    <div class="details">
                        <p>📅 <strong>Data:</strong> 20 września 2026</p>
                        <p>⏰ <strong>Godzina:</strong> 17:00</p>
                        <p>📍 <strong>Miejsce:</strong> Mój dom</p>
                    </div>

                    <p class="ending">
                        Do zobaczenia! 🥳
                    </p>
                </div>
            </div>

        </div>

        <button id="openButton">Otwórz kopertę 💌</button>

    </div>

    <script>
        const envelope = document.getElementById("envelope");
        const button = document.getElementById("openButton");

        button.addEventListener("click", () => {
            envelope.classList.toggle("open");

            if (envelope.classList.contains("open")) {
                button.textContent = "Zamknij kopertę 💌";
            } else {
                button.textContent = "Otwórz kopertę 💌";
            }
        });

        envelope.addEventListener("click", () => {
            envelope.classList.toggle("open");

            if (envelope.classList.contains("open")) {
                button.textContent = "Zamknij kopertę 💌";
            } else {
                button.textContent = "Otwórz kopertę 💌";
            }
        });
    </script>

</body>
</html>
```
