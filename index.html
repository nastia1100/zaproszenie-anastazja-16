<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zaproszenie na 16. urodziny</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #243b68 0%,
                    #111d38 45%,
                    #070d1c 100%
                );

            color: white;
        }

        /* TŁO */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;
        }

        .light {
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(100, 140, 200, 0.08);

            filter: blur(90px);
        }

        .light.one {
            top: -150px;
            left: -100px;
        }

        .light.two {
            bottom: -150px;
            right: -100px;
        }

        /* GŁÓWNY KONTENER */

        .wrapper {
            text-align: center;

            width: 100%;

            padding: 25px;
        }

        .title {
            font-family: Georgia, serif;

            font-size: 44px;

            font-weight: normal;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #aebbd2;

            font-size: 15px;

            margin-bottom: 45px;
        }

        /* KOPERTA */

        .envelope {
            position: relative;

            width: 430px;
            height: 280px;

            margin: auto;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 25px 35px rgba(0, 0, 0, 0.45)
                );

            transition: 0.4s;
        }

        /* TYŁ */

        .back {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    145deg,
                    #1e3b70,
                    #10254b
                );

            border-radius: 8px;

            z-index: 1;
        }

        /* KARTKA */

        .letter {
            position: absolute;

            width: 370px;
            height: 250px;

            left: 50%;
            top: 50%;

            /*
            Kartka jest dokładnie
            na środku koperty,
            ale schowana pod jej elementami.
            */

            transform:
                translate(-50%, -50%)
                scale(0.85);

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #eef2f7
                );

            color: #172744;

            border-radius: 6px;

            padding: 30px;

            z-index: 2;

            opacity: 0;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.4);

            transition:
                opacity 0.5s ease,
                transform 0.9s cubic-bezier(.2,.8,.2,1);

            pointer-events: none;
        }

        .letter-top {
            font-size: 10px;

            letter-spacing: 4px;

            color: #7185a5;

            margin-bottom: 15px;
        }

        .letter h2 {
            font-family: Georgia, serif;

            font-weight: normal;

            font-size: 30px;

            line-height: 1.25;

            color: #142a50;

            margin-bottom: 15px;
        }

        .description {
            color: #596a82;

            font-size: 14px;

            line-height: 1.5;
        }

        .details {
            margin-top: 18px;

            padding: 12px;

            border-top: 1px solid #ccd5e2;
            border-bottom: 1px solid #ccd5e2;

            color: #304566;

            font-size: 12px;

            line-height: 1.8;
        }

        .ending {
            margin-top: 15px;

            font-family: Georgia, serif;

            color: #304566;
        }

        /* PRZÓD KOPERTY */

        .front {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    145deg,
                    #23457d,
                    #132d5a
                );

            clip-path:
                polygon(
                    0 0,
                    50% 55%,
                    100% 0,
                    100% 100%,
                    0 100%
                );

            border-radius: 8px;

            z-index: 4;
        }

        /* KLAPA */

        .flap {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 160px;

            background:
                linear-gradient(
                    145deg,
                    #31558c,
                    #1b386c
                );

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    50% 100%
                );

            transform-origin: top center;

            transition:
                transform 0.8s cubic-bezier(.2,.8,.2,1);

            z-index: 5;
        }

        /* ZŁOTA PIECZĘĆ */

        .seal {
            position: absolute;

            left: 50%;
            top: 125px;

            transform: translateX(-50%);

            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: #d7b56d;

            color: #172b4f;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 13px;
            font-weight: bold;

            z-index: 6;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.25);

            transition:
                opacity 0.3s ease,
                transform 0.4s ease;
        }

        /* =================================
           OTWIERANIE
        ================================= */

        .envelope.open .flap {
            transform: rotateX(180deg);

            z-index: 1;
        }

        .envelope.open .seal {
            opacity: 0;

            transform:
                translateX(-50%)
                scale(0);
        }

        /*
        KARTKA POJAWIA SIĘ
        DOKŁADNIE NA ŚRODKU EKRANU.

        Ponieważ koperta jest również
        wyśrodkowana, środek koperty =
        środek ekranu.
        */

        .envelope.open .letter {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1.35);

            z-index: 10;
        }

        /* PRZYCISK */

        .button {
            margin-top: 50px;

            padding: 14px 30px;

            border-radius: 30px;

            border: 1px solid rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.08);

            color: white;

            font-size: 14px;

            cursor: pointer;

            transition: 0.3s;
        }

        .button:hover {
            background:
                rgba(255,255,255,0.16);

            transform: translateY(-3px);
        }

        .hint {
            margin-top: 15px;

            color: #7586a2;

            font-size: 11px;
        }

        /* =================================
           TELEFON
        ================================= */

        @media (max-width: 600px) {

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 13px;

                margin-bottom: 35px;
            }

            .envelope {
                width: 330px;
                height: 215px;
            }

            .letter {
                width: 285px;
                height: 195px;

                padding: 20px;
            }

            .letter h2 {
                font-size: 22px;
            }

            .description {
                font-size: 11px;
            }

            .details {
                font-size: 9px;

                padding: 7px;

                margin-top: 10px;
            }

            .ending {
                font-size: 11px;

                margin-top: 8px;
            }

            .flap {
                height: 120px;
            }

            .seal {
                width: 40px;
                height: 40px;

                top: 95px;
            }

            /*
            Na telefonie kartka też
            pojawia się na środku.
            */

            .envelope.open .letter {
                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }
        }

    </style>
</head>

<body>

    <div class="background">
        <div class="light one"></div>
        <div class="light two"></div>
    </div>


    <div class="wrapper">

        <h1 class="title">
            Zaproszenie
        </h1>

        <p class="subtitle">
            Otwórz kopertę, aby zobaczyć zaproszenie
        </p>


        <!-- KOPERTA -->

        <div class="envelope" id="envelope">

            <div class="back"></div>


            <!-- KARTKA -->

            <div class="letter">

                <div class="letter-top">
                    SERDECZNIE ZAPRASZAM
                </div>

                <h2>
                    Na moje<br>
                    16. urodziny
                </h2>

                <p class="description">
                    Będzie mi bardzo miło,
                    jeśli spędzisz ze mną
                    ten wyjątkowy dzień.
                </p>

                <div class="details">

                    <div>
                        <strong>20 WRZEŚNIA 2026</strong>
                    </div>

                    <div>
                        GODZINA 17:00
                    </div>

                    <div>
                        MÓJ DOM
                    </div>

                </div>

                <p class="ending">
                    Do zobaczenia!
                </p>

            </div>


            <!-- PRZÓD KOPERTY -->

            <div class="front"></div>


            <!-- KLAPA -->

            <div class="flap"></div>


            <!-- PIECZĘĆ -->

            <div class="seal">
                16
            </div>

        </div>


        <button class="button" id="button">
            Otwórz zaproszenie
        </button>

        <p class="hint">
            kliknij kopertę lub przycisk
        </p>

    </div>


    <script>

        const envelope =
            document.getElementById("envelope");

        const button =
            document.getElementById("button");


        function toggleEnvelope() {

            envelope.classList.toggle("open");

            if (envelope.classList.contains("open")) {

                button.textContent =
                    "Zamknij zaproszenie";

            } else {

                button.textContent =
                    "Otwórz zaproszenie";

            }
        }


        envelope.addEventListener(
            "click",
            toggleEnvelope
        );


        button.addEventListener(
            "click",
            toggleEnvelope
        );

    </script>

</body>
</html>
